<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowDesc: plan the work, follow it through</title>
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="FlowDesc: boards, sprints, issues and analytics, updated live for everyone on your team." />
    <link rel="canonical" href="https://flowdesc.app/" />
    <meta name="theme-color" content="#0f766e" />
    <!-- How a link to the site looks when it is shared (chat apps, social networks, search results). The image is public/og-image-v2.png, 1200x630 (the older og-image.png stays, so links shared before keep their picture; a new file name also makes chat apps fetch the new one). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlowDesc" />
    <meta property="og:title" content="FlowDesc: plan the work, follow it through" />
    <meta property="og:description" content="Boards, sprints, issues and analytics, updated live for everyone on your team." />
    <meta property="og:url" content="https://flowdesc.app/" />
    <meta property="og:image" content="https://flowdesc.app/og-image-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FlowDesc: the board, the issue list and analytics, with the headline Plan the work. Follow it through." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Applies the saved theme before the first paint so a saved choice does
         not flash the wrong colours. Same key as src/shared/theme/theme-store.ts
         (change both together). Guarded: storage can be blocked. -->
    <script>
      try {
        var saved = localStorage.getItem("flowdesc-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
